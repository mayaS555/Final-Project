<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor-article Dashboard | The Daily Web</title>
    <link rel="stylesheet" href="editor-article.css">
</head>

<body>

    <header>
        <h1>The Daily Web</h1>
    </header>

    <main class="article-page">

        <a href="editor.html" class="back-link">
            ← Back to Articles
        </a>

        <!-- article section -->
        <section> 

            <article class="full-article">

                <div  id="article-status" class="article-status">

                </div>

                <h2 id="article-title"></h2>

                <div class="article-details">
                    <p>Reporter:
                        <span id="article-reporter"></span>
                    </p>

                    <p>Submitted:
                        <span id="submitted-date"></span>
                    </p>

                    <p>Last Updated:
                        <span id="updated-date"></span>
                    </p>
                </div>

                <div id="article-content" class="article-content">

                </div>

            </article>

        <!-- editor actions section -->    
        </section>

        <section class="editor-actions">

            <h3>Editor Actions</h3>

            <div class="action-buttons">

                <button class="edit-btn">Edit Article</button>
                <button class="publish-btn">Approve & Publish</button>
                <button class="return-btn">Return for Changes</button>
                <button class="delete-btn">Delete Article</button>

            </div>

            <div class="edit-buttons" id="edit-buttons">

                <button class="save-btn" id="save-btn">
                    Save Changes
                </button>

                <button class="cancel-btn" id="cancel-btn">
                    Cancel
                </button>

            </div>

        </section>

        <!-- return correcting article section- open by Return for Changes -->
        <section class="return-section" id="return-section">

            <h3>Return Article for Changes</h3>

            <label for="editor-comment">
                Comments for the reporter
            </label>

            <textarea
                id="editor-comment"
                name="editor-comment"
                rows="6"
                placeholder="Explain what changes are required..."
            ></textarea>

            <button class="send-return-btn">
                Return Article
            </button>

        </section>

    </main>
    
    <script src="articles-data.js"></script>
    <script src="editor-article.js"></script>

</body>

</html>
