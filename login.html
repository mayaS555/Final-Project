<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Daily Web</title>
</head>

<body>

    <header>
        <h1>The Daily Web</h1>
    </header>

    <main >

        <section class="login-section">
            <div class="login-box">

            <h2>Staff Login</h2>
            <h3>For reporters and editors</h3>

            <form>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">Login</button>

            </form>

                    <a class="back-link" href="index.html">Back to The Daily Web</a>

            </div>
        </section>

    </main>

</body>

</html>
