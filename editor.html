<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Dashboard | The Daily Web</title>
    <link rel="stylesheet" href="editor.css">
</head>

<body>

    <header>
        <h1>The Daily Web</h1>
    </header>

    <main class="editor-container">

        <section class="editor-header">
            <h2>Editor Dashboard</h2>
            <p>Manage and review submitted articles</p>
        </section>

        <section class="filters">

            <button>All Articles</button>
            <button>Pending Approval</button>
            <button>Published</button>
            <button>Need Changes</button>

        </section>

        <section class="articles-list">

            <a href="editor-article.html" class="article-card-link">

                <article class="article-card">

                    <div class="article-status pending">
                        Pending Approval
                    </div>

                    <h3>New Technology Changes Education</h3>

                   <p class="article-info">
                        Reporter: Maya Cohen
                   </p>

                    <p class="article-info">
                       Submitted: September 20, 2026
                    </p>

                    <p class="article-summary">
                       Schools are introducing new technologies that change
                        the way students learn and communicate...
                    </p>

                </article>

            </a>

        </section>

    </main>

</body>

</html>
